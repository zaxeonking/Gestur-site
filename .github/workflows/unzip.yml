name: Auto Extract ZIP

on:
  push:
    paths:
      - '*.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    
    # TAMBAHKAN BARIS INI:
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Files
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting $file..."
              unzip -o "$file" -d ./
              rm "$file"
            fi
          done

      - name: Commit and Push Extracted Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-extracted ZIP contents'
          
